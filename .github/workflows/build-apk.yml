name: Generar APK El Impostor

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar Repositorio
        uses: actions/checkout@v4

      # 1. Descomprime y reubica archivos a la raiz automaticamente
      - name: Preparar y verificar archivos
        run: |
          if ls *.zip 1> /dev/null 2>&1; then
            echo "Detectado archivo ZIP, extrayendo..."
            unzip -o *.zip
          fi

          # Si index.html esta en una subcarpeta, mover todo a la raiz
          if [ ! -f "index.html" ]; then
            SUBDIR=$(find . -maxdepth 2 -name "index.html" -not -path "*/.*" | head -n 1 | xargs -I {} dirname {})
            if [ -n "$SUBDIR" ] && [ "$SUBDIR" != "." ]; then
              echo "Reubicando archivos desde $SUBDIR a la raiz..."
              cp -rf $SUBDIR/* . || true
            fi
          fi

          echo "Estructura del directorio:"
          ls -la

      # 2. Configurar Node.js
      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. Instalar dependencias
      - name: Instalar dependencias
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund
          npm install @capacitor/core @capacitor/cli @capacitor/android --save --legacy-peer-deps

      # 4. Compilar aplicacion web con Vite
      - name: Compilar aplicacion web (Vite)
        run: |
          npx vite build --base=./ --emptyOutDir

      # 5. Configurar Capacitor para Android
      - name: Configurar Capacitor Android
        run: |
          npx cap init "El Impostor" "com.kendry.elimpostor" --web-dir dist || true
          npx cap add android || true
          npx cap sync android

      # 6. Configurar Java JDK 17
      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 7. Configurar Android SDK
      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      # 8. Permisos a Gradlew
      - name: Dar permisos a Gradlew
        run: |
          cd android
          chmod +x gradlew

      # 9. Compilar APK Debug
      - name: Compilar APK Debug
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace --no-daemon

      # 10. Subir archivo APK listo para descargar
      - name: Subir archivo APK listo para descargar
        uses: actions/upload-artifact@v4
        with:
          name: El-Impostor-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
