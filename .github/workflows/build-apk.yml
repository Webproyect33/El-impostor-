name: Generar APK El Impostor

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar Repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android --save

      - name: Compilar aplicación web
        run: npm run build

      - name: Configurar Capacitor para Android
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Dar permisos a Gradlew
        run: chmod +x android/gradlew

      - name: Compilar APK Debug
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Subir archivo APK listo para descargar
        uses: actions/upload-artifact@v4
        with:
          name: El-Impostor-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
