name: Construir APK de El Impostor desde ZIP

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - '**/*.zip'
      - '.github/workflows/**'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Permite ejecutar manualmente desde la pestaña Actions en GitHub

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar el Repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Obtiene todo el historial para detectar la fecha de los commits

      - name: 🔍 Buscar el archivo .zip añadido más recientemente
        id: find_zip
        run: |
          echo "=============================================="
          echo " Buscando archivos .zip en el repositorio..."
          echo "=============================================="
          ZIP_FILES=$(find . -maxdepth 3 -name "*.zip" -type f)
          
          if [ -z "$ZIP_FILES" ]; then
            echo "⚠️ No se encontró ningún archivo .zip. Se usará el código fuente en la raíz."
            echo "USE_ZIP=false" >> $GITHUB_ENV
          else
            echo "Archivos .zip encontrados:"
            echo "$ZIP_FILES"
            
            # Ordenar por fecha de modificación y tomar el más reciente
            LATEST_ZIP=$(ls -t $ZIP_FILES | head -n 1)
            echo "✅ Archivo .zip más reciente seleccionado: $LATEST_ZIP"
            echo "LATEST_ZIP=$LATEST_ZIP" >> $GITHUB_ENV
            echo "USE_ZIP=true" >> $GITHUB_ENV
          fi

      - name: 📦 Extraer el archivo .zip seleccionado
        if: env.USE_ZIP == 'true'
        run: |
          mkdir -p workspace_app
          unzip -o "$LATEST_ZIP" -d workspace_app
          echo "Contenido extraído en workspace_app:"
          ls -la workspace_app

      - name: ⚙️ Configurar Directorio de Trabajo
        run: |
          if [ "$USE_ZIP" = "true" ]; then
            if [ ! -f "workspace_app/package.json" ]; then
              SUBDIR=$(find workspace_app -maxdepth 2 -name "package.json" -exec dirname {} \;)
              if [ -n "$SUBDIR" ]; then
                echo "Moviendo archivos desde $SUBDIR a workspace_app"
                cp -r $SUBDIR/* workspace_app/ || true
              fi
            fi
            echo "APP_DIR=workspace_app" >> $GITHUB_ENV
          else
            echo "APP_DIR=." >> $GITHUB_ENV
          fi

      - name: 🟢 Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: ☕ Configurar Java JDK 17 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📱 Configurar Android SDK Nativo de GitHub
        run: |
          echo "Configurando Android SDK integrado en el runner..."
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          
          # Aceptar automáticamente todas las licencias de Android SDK
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || yes | sdkmanager --licenses || true

      - name: 📥 Instalar Dependencias de la App
        working-directory: ${{ env.APP_DIR }}
        run: |
          npm install --legacy-peer-deps
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest --save

      - name: 🏗️ Compilar Proyecto Web (Vite)
        working-directory: ${{ env.APP_DIR }}
        run: npm run build

      - name: 🤖 Inicializar y Sincronizar Capacitor Android
        working-directory: ${{ env.APP_DIR }}
        run: |
          if [ ! -f "capacitor.config.json" ]; then
            cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.kendry.elimpostor",
            "appName": "El Impostor",
            "webDir": "dist",
            "server": {
              "androidScheme": "https"
            }
          }
          EOF
          fi
          
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          
          npx cap sync android

      - name: 🛠️ Compilar el archivo APK con Gradle
        working-directory: ${{ env.APP_DIR }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 📤 Subir APK Generado como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: El-Impostor-APK-Debug
          path: ${{ env.APP_DIR }}/android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: 🎉 Notificación de Éxito
        run: |
          echo "================================================="
          echo " ¡APK COMPILADO CON ÉXITO! 🎉"
          echo " Puedes descargarlo en la pestaña 'Artifacts' de este run de GitHub Actions."
          echo "================================================="
