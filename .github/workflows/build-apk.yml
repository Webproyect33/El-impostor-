name: Generar APK El Impostor

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar Repositorio
        uses: actions/checkout@v4

      # Si subiste el archivo .zip directamente a GitHub, lo descomprime automaticamente
      - name: Descomprimir ZIP si existe
        run: |
          if ls *.zip 1> /dev/null 2>&1; then
            echo "Detectado archivo ZIP, descomprimiendo..."
            unzip -o *.zip
          fi

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund
          npm install @capacitor/core @capacitor/cli @capacitor/android --save --legacy-peer-deps

      - name: Compilar aplicacion web (Vite)
        run: |
          npx vite build --base=./

      - name: Configurar Capacitor para Android
        run: |
          npx cap init "El Impostor" "com.kendry.elimpostor" --web-dir dist || true
          npx cap add android || true
          npx cap sync android

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Dar permisos de ejecucion a Gradlew
        run: |
          cd android
          chmod +x gradlew

      - name: Compilar APK Debug
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Subir archivo APK listo para descargar
        uses: actions/upload-artifact@v4
        with:
          name: El-Impostor-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
